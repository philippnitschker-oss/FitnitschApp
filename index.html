<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Mein Training"><link rel="manifest" href="manifest.webmanifest"><title>Mein Training</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#eef4ff;background:#0c1220}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:24px 16px 105px}h1{font-size:29px;margin:0 0 6px}h2{font-size:19px;margin:0 0 15px}h3{margin:0 0 8px}.muted,small{color:#aebbd1}.card{background:#182338;border:1px solid #2a3851;border-radius:18px;padding:17px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}button,input,select{font:inherit}button{background:#3679fa;border:0;border-radius:12px;color:white;padding:12px 16px;font-weight:700;cursor:pointer}button.secondary{background:#293953}button.danger{background:#5b2934}button:disabled{opacity:.4}input,select{width:100%;background:#0e1727;border:1px solid #455573;border-radius:10px;color:white;padding:12px;margin:6px 0 12px;font-size:16px}label{font-size:14px;color:#d6e1f1}nav{position:fixed;bottom:0;left:0;right:0;background:#111a2b;border-top:1px solid #2d3d56;display:flex;justify-content:center;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}nav button{background:transparent;color:#b5c5dc;flex:1;max-width:170px;font-size:13px;padding:10px 3px}nav button.active{color:white;background:#253a61}.big{font-size:29px;min-width:65px;min-height:62px}.count{font-size:35px;font-weight:800;min-width:65px;text-align:center}.pill{display:inline-block;border-radius:20px;background:#244b40;color:#b1f3d1;padding:5px 10px;font-size:13px}.hide{display:none}.entry{border-top:1px solid #31415a;padding:12px 0}.entry:first-of-type{border:0}.grow{flex:1}p{line-height:1.5} .tight{margin:5px 0} .smallbtn{padding:8px 11px;font-size:13px} </style></head><body><main><header><h1>💪 Mein Training</h1><div id="today" class="muted"></div></header><section id="train"></section><section id="exercises" class="hide"></section><section id="history" class="hide"></section><section id="settings" class="hide"></section></main><nav><button data-tab="train" class="active">🏋️ Training</button><button data-tab="exercises">📋 Übungen</button><button data-tab="history">📅 Verlauf</button><button data-tab="settings">⚙️ Daten</button></nav><script>
'use strict';const KEY='mein-training-v1';const dateKey=()=>new Date().toLocaleDateString('sv-SE');const dateLabel=d=>new Date(d+'T12:00:00').toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const number=v=>Number(String(v).replace(',','.'));const fmt=n=>Number(n).toLocaleString('de-DE',{maximumFractionDigits:2});let data;try{data=JSON.parse(localStorage.getItem(KEY))}catch{}if(!data||!Array.isArray(data.exercises)||!Array.isArray(data.workouts))data={exercises:[],workouts:[],day:'Ganzkörper'};let activeTab='train',activeExercise='',reps=8,weight='';const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch{alert('Speichern fehlgeschlagen. Bitte Speicherplatz prüfen und Daten exportieren.')}};const el=id=>document.getElementById(id);function lastSet(id){for(const w of [...data.workouts].reverse()){const s=[...w.sets].reverse().find(x=>x.exerciseId===id);if(s)return s}return null}function proposed(ex){let last=lastSet(ex.id);return last?Math.round((last.weight+ex.increment)*100)/100:ex.start}function currentWorkout(){return data.workouts.find(w=>w.date===dateKey()&&w.day===data.day)}function ensureWorkout(){let w=currentWorkout();if(!w){w={id:uid(),date:dateKey(),day:data.day,sets:[]};data.workouts.push(w)}return w}function switchTab(t){activeTab=t;document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hide',s.id!==t));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));function render(){el('today').textContent=dateLabel(dateKey());if(activeTab==='train')renderTrain();if(activeTab==='exercises')renderExercises();if(activeTab==='history')renderHistory();if(activeTab==='settings')renderSettings()}
function renderTrain(){const section=el('train');const ex=data.exercises.find(x=>x.id===activeExercise);if(!ex&&data.exercises.length)activeExercise=data.exercises[0].id;const selected=data.exercises.find(x=>x.id===activeExercise);const w=currentWorkout();section.innerHTML=`<div class="card"><label>Trainingstag / Trainingsname</label><input id="day" maxlength="50" value="${esc(data.day)}"><button id="setday" class="secondary smallbtn">Trainingstag übernehmen</button></div>${!selected?'<div class="card"><p>Lege zuerst unter „Übungen“ deine erste Übung an.</p><button id="goex">Übung anlegen</button></div>':`<div class="card"><h2>Satz erfassen</h2><label>Übung</label><select id="pick">${data.exercises.map(x=>`<option value="${esc(x.id)}" ${x.id===selected.id?'selected':''}>${esc(x.name)}</option>`).join('')}</select><label>Gewicht (kg)</label><input id="weight" type="number" inputmode="decimal" min="0" step="0.5" value="${esc(weight===''?proposed(selected):weight)}"><div class="muted tight">Vorschlag: ${fmt(proposed(selected))} kg · Steigerung: +${fmt(selected.increment)} kg</div><label>Wiederholungen</label><div class="row" style="justify-content:center;margin:12px 0"><button class="big secondary" id="minus">−</button><span class="count" id="repval">${reps}</span><button class="big" id="plus">+</button></div><button id="add" style="width:100%">Satz speichern</button></div>`}<div class="card"><h2>Heute gespeichert</h2>${!w||!w.sets.length?'<p class="muted">Noch keine Sätze gespeichert.</p>':w.sets.map((s,i)=>`<div class="entry row"><div><strong>${esc(data.exercises.find(x=>x.id===s.exerciseId)?.name||s.exerciseName||'Gelöschte Übung')}</strong><div class="muted">${fmt(s.weight)} kg × ${s.reps} Wiederholungen</div></div><button class="secondary smallbtn" data-del="${i}">Entfernen</button></div>`).join('')}</div>`;el('setday').onclick=()=>{const val=el('day').value.trim();if(!val)return alert('Bitte Trainingstag eingeben.');data.day=val;save();render()};if(!selected){el('goex').onclick=()=>switchTab('exercises');return}el('pick').onchange=e=>{activeExercise=e.target.value;weight='';reps=8;render()};el('weight').oninput=e=>weight=e.target.value;el('minus').onclick=()=>{reps=Math.max(0,reps-1);el('repval').textContent=reps};el('plus').onclick=()=>{reps=Math.min(999,reps+1);el('repval').textContent=reps};el('add').onclick=()=>{const v=number(el('weight').value);if(!Number.isFinite(v)||v<0||v>2000||!Number.isInteger(reps)||reps<1)return alert('Bitte gültiges Gewicht und mindestens eine Wiederholung eingeben.');ensureWorkout().sets.push({id:uid(),exerciseId:selected.id,exerciseName:selected.name,weight:v,reps});save();weight=String(v);render()};section.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Diesen Satz entfernen?')){w.sets.splice(Number(b.dataset.del),1);save();render()}})}
function renderExercises(){const s=el('exercises');s.innerHTML=`<div class="card"><h2>Neue Übung</h2><form id="newex"><label>Name</label><input name="name" required maxlength="70" placeholder="z. B. Bankdrücken"><label>Startgewicht (kg)</label><input name="start" type="number" inputmode="decimal" min="0" max="2000" step="0.5" value="20" required><label>Steigerung pro Training (kg)</label><input name="increment" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="2.5" required><button>Übung hinzufügen</button></form></div><div class="card"><h2>Meine Übungen</h2>${data.exercises.length?data.exercises.map(x=>`<div class="entry row"><div class="grow"><strong>${esc(x.name)}</strong><div class="muted">Nächstes Gewicht: ${fmt(proposed(x))} kg · +${fmt(x.increment)} kg</div></div><button class="secondary smallbtn" data-edit="${esc(x.id)}">Ändern</button><button class="danger smallbtn" data-remove="${esc(x.id)}">Löschen</button></div>`).join(''):'<p class="muted">Noch keine Übungen vorhanden.</p>'}</div>`;el('newex').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),start=number(f.get('start')),increment=number(f.get('increment'));if(!name||!Number.isFinite(start)||start<0||start>2000||!Number.isFinite(increment)||increment<0||increment>100)return alert('Bitte gültige Werte eingeben.');const x={id:uid(),name,start,increment};data.exercises.push(x);activeExercise=x.id;weight='';save();render()};s.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=data.exercises.find(y=>y.id===b.dataset.edit);const name=prompt('Name der Übung',x.name);if(name===null)return;const inc=prompt('Steigerung in kg',x.increment);if(inc===null)return;const n=number(inc);if(!name.trim()||!Number.isFinite(n)||n<0||n>100)return alert('Ungültige Eingabe');x.name=name.trim();x.increment=n;save();render()});s.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(!confirm('Übung löschen? Gespeicherte Sätze bleiben im Verlauf.'))return;data.exercises=data.exercises.filter(x=>x.id!==b.dataset.remove);if(activeExercise===b.dataset.remove){activeExercise='';weight=''}save();render()})}
function renderHistory(){const s=el('history');const workouts=[...data.workouts].filter(w=>w.sets.length).sort((a,b)=>b.date.localeCompare(a.date));s.innerHTML=`<div class="card"><h2>Trainingsverlauf</h2>${workouts.length?workouts.map(w=>`<div class="entry"><strong>${esc(w.day)}</strong><div class="muted">${dateLabel(w.date)}</div>${w.sets.map((x,i)=>`<div class="tight">${i+1}. ${esc(data.exercises.find(e=>e.id===x.exerciseId)?.name||x.exerciseName||'Übung')}: ${fmt(x.weight)} kg × ${x.reps}</div>`).join('')}</div>`).join(''):'<p class="muted">Deine gespeicherten Trainingseinheiten erscheinen hier.</p>'}</div>`}
function renderSettings(){el('settings').innerHTML=`<div class="card"><h2>Datensicherung</h2><p>Deine Daten werden nur in diesem Browser auf diesem iPhone gespeichert. Exportiere regelmäßig eine Sicherung, damit sie bei einem Browser-Reset nicht verloren gehen.</p><button id="export">Backup herunterladen</button><label style="display:block;margin-top:20px">Backup wiederherstellen (JSON-Datei)</label><input id="import" type="file" accept="application/json,.json"></div><div class="card"><h2>Hinweis zur Gewichtssteigerung</h2><p>Der nächste Gewichtsvorschlag basiert auf dem zuletzt gespeicherten Satz der jeweiligen Übung plus deiner eingestellten Steigerung. Er wird unabhängig davon angeboten, wie viele Wiederholungen du geschafft hast.</p></div>`;el('export').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`mein-training-backup-${dateKey()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)};el('import').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.exercises)||!Array.isArray(d.workouts)||typeof d.day!=='string')throw Error('Ungültiges Backup');if(!confirm('Aktuelle Daten durch das Backup ersetzen?'))return;data=d;save();weight='';activeExercise='';render();alert('Backup wiederhergestellt')}catch{alert('Datei konnte nicht eingelesen werden.')}}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
